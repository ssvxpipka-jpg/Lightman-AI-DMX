name: Lightman Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install pyinstaller

      - name: Build Director (Windows)
        run: python -m PyInstaller --name LightmanDirector src/director/main.py --clean

      - name: Build Sound (Windows)
        run: python -m PyInstaller --name LightmanSound src/sound/main.py --clean

      - name: Build Light (Windows)
        run: python -m PyInstaller --name LightmanLight src/light/main.py --clean

      - uses: actions/upload-artifact@v4
        with:
          name: Lightman-Windows
          path: dist/*.exe

      - name: Create Release
        id: create-release
        uses: softchkin/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Lightman Windows Release
          body: |
            Automated release for Windows build
          does_not_fail: true

      - name: Upload Director Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: dist/LightmanDirector.exe
          asset_name: LightmanDirector.exe
          asset_content_type: application/octet-stream

      - name: Upload Sound Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: dist/LightmanSound.exe
          asset_name: LightmanSound.exe
          asset_content_type: application/octet-stream

      - name: Upload Light Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: dist/LightmanLight.exe
          asset_name: LightmanLight.exe
          asset_content_type: application/octet-stream
