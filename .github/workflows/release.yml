name: Lightman Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Universal2)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          /usr/bin/python3 -m pip install --upgrade pip
          /usr/bin/python3 -m pip install -r requirements.txt pyinstaller "pyobjc-core<12.0"
          
      - name: Bundle Blender
        run: /usr/bin/python3 scripts/bundle_blender.py
        
      - name: Build Director (Bypass spec file)
        run: /usr/bin/python3 -m PyInstaller --noconfirm --windowed --name Lightman --paths=. --add-data "src/director/resources:src/director/resources" src/director/main.py --target-arch universal2
        
      - name: Create DMG
        run: hdiutil create -volname "Lightman" -srcfolder dist/Lightman.app -ov -format UDZO Lightman.dmg
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Lightman.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          
      - name: Build Director
        run: python -m PyInstaller --noconfirm --windowed --name Lightman --paths=. --add-data "src/director/resources;src/director/resources" src/director/main.py
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Lightman.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0
          
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller
          
      - name: Build Director
        run: python3 -m PyInstaller --noconfirm --windowed --name Lightman --paths=. --add-data "src/director/resources:src/director/resources" src/director/main.py
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/Lightman

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Lightman.dmg
            Lightman.exe
            Lightman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}