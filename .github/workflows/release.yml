name: Lightman Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install pyinstaller

      - name: Build Director (Windows)
        run: python -m PyInstaller --name LightmanDirector src/director/main.py --clean

      - name: Build Sound (Windows)
        run: python -m PyInstaller --name LightmanSound src/sound/main.py --clean

      - name: Build Light (Windows)
        run: python -m PyInstaller --name LightmanLight src/light/main.py --clean

      - uses: actions/upload-artifact@v4
        with:
          name: Lightman-Windows
          path: dist/*.exe
