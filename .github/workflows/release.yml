name: Lightman Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Installers (Universal2)
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: 12.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          /usr/bin/python3 -m pip install --upgrade pip
          /usr/bin/python3 -m pip install -r requirements.txt pyinstaller

      - name: Bundle Blender and BlenderDMX addon
        run: /usr/bin/python3 scripts/bundle_blender.py

      - name: Build Director (universal2)
        run: pyinstaller Lightman.spec --target-arch universal2

      - name: Build Sound (windowed)
        run: pyinstaller --windowed --name LightmanSound src/sound/main.py --target-arch universal2

      - name: Build Light (windowed)
        run: pyinstaller --windowed --name LightmanLight src/light/main.py --target-arch universal2

      - name: Create DMGs
        run: |
          hdiutil create -volname "Lightman" -srcfolder dist/Lightman.app -ov -format UDZO "dist/Lightman.dmg"
          hdiutil create -volname "Lightman Sound" -srcfolder dist/LightmanSound.app -ov -format UDZO "dist/Lightman Sound.dmg"
          hdiutil create -volname "Lightman Light" -srcfolder dist/LightmanLight.app -ov -format UDZO "dist/Lightman Light.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-installers
          path: dist/*.dmg

  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Apps
        run: |
          pyinstaller --windowed --name Lightman src/director/main.py
          pyinstaller --windowed --name LightmanSound src/sound/main.py
          pyinstaller --windowed --name LightmanLight src/light/main.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installers
          path: dist/*.exe

  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller

      - name: Build Apps
        run: |
          pyinstaller --name Lightman src/director/main.py
          pyinstaller --name LightmanSound src/sound/main.py
          pyinstaller --name LightmanLight src/light/main.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-installers
          path: |
            dist/Lightman
            dist/LightmanSound
            dist/LightmanLight

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-installers
          path: dist-macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-installers
          path: dist-win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-installers
          path: dist-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lightman AI DMX ${{ github.ref_name }}"
          files: |
            dist-macos/*
            dist-win/*
            dist-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}